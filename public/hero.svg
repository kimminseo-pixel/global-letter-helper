<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
  <title id="t">세계 지도 위로 공문이 오가는 그림</title>
  <desc id="d">푸른 지구본과 공문 봉투, 인장이 있는 일러스트</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="globe" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="0.6" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="520" rx="28" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.12">
    <circle cx="90" cy="80" r="46"/>
    <circle cx="700" cy="440" r="70"/>
    <circle cx="730" cy="90" r="22"/>
    <circle cx="60" cy="440" r="28"/>
  </g>

  <!-- 지구본 -->
  <g transform="translate(250 270)">
    <circle r="180" fill="url(#globe)" filter="url(#shadow)"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3">
      <ellipse rx="180" ry="62"/>
      <ellipse rx="180" ry="125"/>
      <ellipse rx="62" ry="180"/>
      <ellipse rx="125" ry="180"/>
      <line x1="-180" y1="0" x2="180" y2="0"/>
      <line x1="0" y1="-180" x2="0" y2="180"/>
    </g>
    <g fill="#bbf7d0" opacity="0.85">
      <path d="M-120 -60 C-95 -100 -55 -95 -40 -70 C-30 -45 -60 -30 -80 -25 C-100 -20 -125 -35 -120 -60Z"/>
      <path d="M20 -90 C60 -110 110 -85 105 -50 C100 -20 60 -35 40 -25 C15 -15 5 -60 20 -90Z"/>
      <path d="M-30 30 C0 10 50 20 55 55 C58 90 20 120 -10 105 C-40 90 -55 50 -30 30Z"/>
    </g>
  </g>

  <!-- 공문 -->
  <g transform="translate(470 170) rotate(6)" filter="url(#shadow)">
    <rect width="260" height="320" rx="14" fill="url(#paper)"/>
    <rect x="28" y="30" width="110" height="14" rx="7" fill="#1e3a8a"/>
    <g fill="#94a3b8">
      <rect x="28" y="70" width="204" height="9" rx="4.5"/>
      <rect x="28" y="92" width="190" height="9" rx="4.5"/>
      <rect x="28" y="114" width="204" height="9" rx="4.5"/>
      <rect x="28" y="136" width="160" height="9" rx="4.5"/>
      <rect x="28" y="170" width="204" height="9" rx="4.5"/>
      <rect x="28" y="192" width="176" height="9" rx="4.5"/>
      <rect x="28" y="214" width="196" height="9" rx="4.5"/>
    </g>
    <path d="M28 268 C60 240 82 296 110 262 S160 250 180 268" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(200 262)">
      <circle r="34" fill="#dc2626"/>
      <circle r="27" fill="none" stroke="#fecaca" stroke-width="3"/>
      <text y="9" text-anchor="middle" font-size="26" font-weight="700" fill="#fff" font-family="serif">公</text>
    </g>
  </g>

  <!-- 날아가는 선 -->
  <path d="M400 150 C450 80 540 70 610 110" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>
  <g transform="translate(618 112) rotate(-18)">
    <path d="M0 0 L26 -6 L8 12 L5 4Z" fill="#ffffff"/>
  </g>
</svg>
